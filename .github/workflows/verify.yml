name: Verify tap

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify — ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mac Apple Silicon
            runner: macos-15
            arch: arm64
          - name: Mac Intel
            runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_DEVELOPER: '1'
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
      HYPER_CHAMBER_SMOKE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Register the checkout as the tap
        run: |
          hyper_chamber_tap_dir="$(brew --repository)/Library/Taps/squid-quarters/homebrew-tap"
          mkdir -p "$(dirname "$hyper_chamber_tap_dir")"
          test ! -e "$hyper_chamber_tap_dir"
          test ! -L "$hyper_chamber_tap_dir"
          ln -s "$GITHUB_WORKSPACE" "$hyper_chamber_tap_dir"
          brew trust --cask squid-quarters/tap/hyper-chamber
          brew trust --cask squid-quarters/tap/hyper-chamber@beta
      - run: make audit-online
      - name: Test beta-to-stable installation and data preservation
        run: bash script/smoke-migration.sh
